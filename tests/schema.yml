version: 2

models:

  - name: stg_customers
    columns:

      - name: phone
        tests:
          - unique
          - not_null

      - name: email
        tests:
          - not_null

  - name: stg_products
    columns:

      - name: product_id
        tests:
          - unique
          - not_null

  - name: stg_orders
    columns:

      - name: order_id
        tests:
          - unique
          - not_null