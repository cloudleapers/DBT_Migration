  <!-- LEGEND -->
  <rect x="20" y="800" width="1360" height="170" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="35" y="825" font-family="Arial" font-size="13" font-weight="bold" fill="#475569">How to read this lineage</text>
  <text x="35" y="847" font-family="Arial" font-size="11" fill="#444">  •  Each box represents one dbt model (or source table for the leftmost column).</text>
  <text x="35" y="865" font-family="Arial" font-size="11" fill="#444">  •  Arrows show the {{ ref() }} or {{ source() }} dependencies dbt resolves automatically.</text>
  <text x="35" y="883" font-family="Arial" font-size="11" fill="#444">  •  dbt builds models in dependency order — sources first, then staging, then intermediate, then marts.</text>
  <text x="35" y="901" font-family="Arial" font-size="11" fill="#444">  •  The red dashed BRIDGE box (int_encounter_with_claim) is the join point between clinical and financial domains.</text>
  <text x="35" y="921" font-family="Arial" font-size="11" fill="#444">  •  STAGING + INTERMEDIATE materialize as views (cheap to recompute). MART materializes as tables (pre-computed for fast BI queries).</text>
  <text x="35" y="941" font-family="Arial" font-size="11" fill="#444">  •  This is a partial lineage — full project has 48 models. Run `dbt docs serve` for the interactive complete lineage graph.</text>
  <text x="35" y="961" font-family="Arial" font-size="11" fill="#444">  •  For deeper drill-down, check docs/03_DATA_LINEAGE.md which lists every model and its upstream / downstream dependencies.</text>
</svg>
